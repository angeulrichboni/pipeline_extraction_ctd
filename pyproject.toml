[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-extraction-ctd"
version = "3.0.0"
description = "Extraction CTD (agents LLM) et mapping des effets sanitaires vers ICD-10 (OMS, release 2019)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
