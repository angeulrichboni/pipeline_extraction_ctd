[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-exposition-sante"
version = "2.0.0"
description = "Pipeline unifié : normalisation ICD-11, personas et p0, simulation et trajectoire d'exposition, dataset exposition-santé."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
